name: Build & Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Build site
        run: zola build

      - name: Install rclone
        run: |
          curl -sO https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/
          rclone version

      - name: Sync to BunnyCDN storage
        env:
          RCLONE_CONFIG_BUNNY_TYPE: bunny
          RCLONE_CONFIG_BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          RCLONE_CONFIG_BUNNY_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: 'rclone sync public/ bunny: --verbose'

      - name: Purge CDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
        run: |
          curl --request POST \
            --url "https://api.bunny.net/pullzone/${BUNNY_PULLZONE_ID}/purgeCache" \
            --header "AccessKey: ${BUNNY_API_KEY}" \
            --header "content-type: application/json"
