name: Build & Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: Install dependencies
        run: apk add --no-cache git rclone curl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: Build site
        run: zola build

      - name: Sync to BunnyCDN storage
        env:
          RCLONE_CONFIG_BUNNY_TYPE: s3
          RCLONE_CONFIG_BUNNY_PROVIDER: Other
          RCLONE_CONFIG_BUNNY_ENDPOINT: https://ny-s3.storage.bunnycdn.com
          RCLONE_CONFIG_BUNNY_ACCESS_KEY_ID: ${{ secrets.BUNNY_STORAGE_ZONE }}
          RCLONE_CONFIG_BUNNY_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          RCLONE_CONFIG_BUNNY_FORCE_PATH_STYLE: "true"
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONFIG_BUNNY_ACCESS_KEY_ID"
          test -n "$RCLONE_CONFIG_BUNNY_SECRET_ACCESS_KEY"
          rclone sync public/ "bunny:${RCLONE_CONFIG_BUNNY_ACCESS_KEY_ID}" --verbose

      - name: Purge CDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
        run: |
          set -euo pipefail
          test -n "$BUNNY_API_KEY"
          test -n "$BUNNY_PULLZONE_ID"
          curl --request POST \
            --url "https://api.bunny.net/pullzone/${BUNNY_PULLZONE_ID}/purgeCache" \
            --header "AccessKey: ${BUNNY_API_KEY}" \
            --header "content-type: application/json"
