{% extends "base.html" %}

{% block content %}

<!-- avatar & bio -->
<div class="-mt-2 mb-12 flex items-center">
  {% if config.extra.avatar %}
  <div
    class="h-24 w-24 shrink-0 rounded-full border-[0.5px] border-black/10 bg-white/50 p-3 ltr:mr-5 ltr:-ml-1 rtl:-mr-1 rtl:ml-5 dark:bg-white/90!"
  >
    <img
      class="not-prose my-0 h-full w-full rounded-full bg-black/5! dark:bg-black/80!"
      src="{{ config.extra.avatar | safe }}"
      alt="{{ config.extra.name | default(value=config.title) }}"
    />
  </div>
  {% endif %}
  <div>
    <div class="break-words">
      {{ config.extra.bio }}
    </div>
  </div>
</div>

{% set blog = get_section(path="blog/_index.md") %}
{% for page in blog.pages %}
<section class="relative my-10 first-of-type:mt-0 last-of-type:mb-0">
  <h2 class="my-0!">{{ page.title }}</h2>
  <time class="text-xs antialiased opacity-60">{{ page.date | date(format="%b %-d, %Y") }}</time>
  <a class="absolute inset-0 text-[0px]" href="{{ page.permalink | safe }}">{{ page.title }}</a>
</section>
{% endfor %}

{% endblock %}
